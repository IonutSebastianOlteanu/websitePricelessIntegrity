<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>MADAM BEAUTY | by PRICELESS Integrity</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root {
            --primary-gold: #dfb76c; /* Vibrant gold from logo */
            --light-text: #f5f5f5;
            --dark-bg: #0b0b0b; /* Deep rich black */
            --card-bg: #161616; /* Premium dark grey for contrast */
        }
        body {
            font-family: Arial, sans-serif;
            margin: 0;
            background-color: var(--dark-bg);
            color: var(--light-text);
            line-height: 1.6;
        }
        header {
            background: #111111;
            padding: 1rem 5%;
            text-align: center;
            color: var(--primary-gold);
            border-bottom: 1px solid rgba(223, 183, 108, 0.15);
        }
        .hero {
            padding: 60px 20px;
            text-align: center;
            background: linear-gradient(rgba(11,11,11,0.75), rgba(11,11,11,0.75)), url('https://images.unsplash.com/photo-1560066984-138dadb4c035?ixlib=rb-1.2.1&auto=format&fit=crop&w=1350&q=80');
            background-size: cover;
            background-position: center;
        }
        .hero h1 {
            font-size: 2.5rem;
            margin-bottom: 10px;
            color: var(--primary-gold);
        }
        .hero p {
            font-size: 1.5rem;
            margin-top: 0;
            margin-bottom: 2rem;
        }
        .container h2 {
            color: var(--primary-gold);
        }
        .container {
            max-width: 1000px;
            margin: 40px auto;
            padding: 0 20px;
        }
        .services-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-top: 30px;
        }
        .service-card {
            background: var(--card-bg);
            padding: 20px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            text-align: center;
            border-top: 3px solid var(--primary-gold);
            cursor: pointer;
            transition: transform 0.2s ease;
        }
        .service-card:hover {
            transform: translateY(-5px);
        }
        button {
            background-color: var(--primary-gold);
            color: white;
            border: none;
            padding: 12px 30px;
            border-radius: 4px;
            cursor: pointer;
            font-size: 1rem;
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 1px;
            border: 2px solid var(--primary-gold);
            transition: background-color 0.3s, color 0.3s;
        }
        button:hover {
            opacity: 0.9;
        }
        /* Intro Overlay Slider Styles */
        .intro-overlay {
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background-color: #000000;
            z-index: 9999;
            display: flex;
            justify-content: center;
            align-items: center;
            transition: opacity 0.8s ease, visibility 0.8s ease;
        }
        .intro-overlay.hidden {
            opacity: 0;
            visibility: hidden;
        }
        .intro-content {
            text-align: center;
            position: absolute;
            bottom: 10%;
            z-index: 10;
        }
        .intro-img {
            position: absolute;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            object-fit: contain;
        }
        .intro-content button {
            background-color: #dfb76c; /* Vibrant gold matching the logo */
            color: #000000; /* Deep black text for readability */
            font-weight: bold;
            text-transform: uppercase;
            letter-spacing: 2px;
            border: 2px solid #dfb76c;
        }
        .intro-content button:hover {
            background-color: transparent;
            color: #dfb76c;
        }
        /* Contact Section Styles */
        .contact-section {
            max-width: 1000px;
            margin: 60px auto;
            padding: 0 20px;
        }
        .contact-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(300px, 1fr));
            gap: 30px;
        }
        .contact-card, .contact-map {
            background: var(--card-bg);
            padding: 30px;
            border-radius: 4px;
            box-shadow: 0 4px 15px rgba(0,0,0,0.4);
            border-top: 3px solid var(--primary-gold);
        }
        .contact-map {
            padding: 0;
            overflow: hidden;
            min-height: 350px;
            display: flex;
            flex-direction: column;
        }
        .contact-map iframe {
            flex-grow: 1;
            width: 100%;
            border: 0;
            filter: grayscale(0.4);
        }
        .directions-link {
            display: block;
            text-align: center;
            background-color: var(--primary-gold);
            color: #000;
            text-decoration: none;
            padding: 12px;
            font-weight: bold;
            text-transform: uppercase;
            font-size: 0.9rem;
            transition: opacity 0.3s;
        }
        .directions-link:hover {
            opacity: 0.9;
        }
        .contact-card h3 {
            color: var(--primary-gold);
            margin-top: 0;
        }
        .contact-info-item p {
            margin: 5px 0;
        }
        .contact-info-item strong {
            color: var(--primary-gold);
        }
        .form-control {
            width: 100%;
            padding: 12px;
            background-color: #222;
            border: 1px solid #444;
            border-radius: 4px;
            color: var(--light-text);
            box-sizing: border-box;
            font-size: 1rem;
        }
        .form-control:focus {
            border-color: var(--primary-gold);
            outline: none;
        }
    </style>
</head>
<body>

    <!-- Intro Welcome Screen -->
    <div id="introScreen" class="intro-overlay">
        <img src="salonIntro.jpeg" alt="Madam Beauty Welcome" class="intro-img">
        <div class="intro-content">
            <button onclick="closeIntro()">Enter Experience</button>
        </div>
    </div>

    <header>
        <h2>Madam BEAUTY by PRICELESS Integrity</h2>
    </header>

    <section class="hero">
        <h1>Elegance & Style</h1>
        <p>Expert beauty services tailored just for you.</p>
    </section>

    <div class="container">
        <h2 style="text-align: center;">Our Services</h2>
        <div style="display: flex; justify-content: center; align-items: center; gap: 10px; margin-bottom: 30px;">
            <input type="text" id="serviceSearch" class="form-control" placeholder="Search for a service (e.g., 'Cuts', 'Facial')..." 
                   style="max-width: 500px;" oninput="handleSearch(event)">
            <button id="clearSearchBtn" onclick="clearSearch()" style="display: none; padding: 8px 15px; font-size: 0.8rem; background: transparent; border: 1px solid var(--primary-gold); color: var(--primary-gold);">Clear</button>
        </div>
        <div class="services-grid" id="servicesGrid">
            <!-- Services are rendered dynamically via JavaScript for easier management -->
        </div>
    </div>

    <div class="contact-section">
        <h2 style="text-align: center; margin-bottom: 30px;">Contact Us</h2>
        <div class="contact-grid">
            <div class="contact-card" id="ownerCard">
                <!-- Owner details are rendered dynamically via contact.js -->
            </div>

            <div class="contact-map">
                <iframe 
                    src="https://www.google.com/maps/embed?pb=!1m18!1m12!1m3!1d2850.143242058348!2d23.83100517671151!3d44.31289197107787!2m3!1f0!2f0!3f0!3m2!1i1024!2i768!4f13.1!3m3!1m2!1s0x4752d65601fb2101%3A0xda405cde8300a0de!2sElectroputere%20Mall!5e0!3m2!1sen!2sro!4v1715694321234!5m2!1sen!2sro" 
                    allowfullscreen="" 
                    loading="lazy" 
                    referrerpolicy="no-referrer-when-downgrade">
                </iframe>
                <a href="https://www.google.com/maps/dir/?api=1&destination=Electroputere+Mall+Craiova" target="_blank" class="directions-link">Get Directions</a>
            </div>

        </div>
    </div>

    <!-- Owner Control Panel Section -->
    <div id="adminPanelSection" class="container" style="display: none; background: var(--card-bg); padding: 30px; border-radius: 4px; border: 1px solid var(--primary-gold); margin-top: 40px;">
        <h2 style="color: var(--primary-gold); text-align: center; margin-top: 0;">Owner Control Panel</h2>
        <div id="adminPanelContent"></div>
    </div>

    <footer style="text-align: center; padding: 40px; opacity: 0.75;">
        <div id="footerCopyright" style="margin-bottom: 20px; font-size: 0.85rem;"></div>
        <button onclick="accessOwnerPortal()" style="background: transparent; border: 1px solid #444; color: #888; font-size: 0.8rem; padding: 5px 15px; text-transform: none; letter-spacing: 0;">Owner Portal</button>
    </footer>

    <!-- Load modularized business logic files -->
    <script src="services.js"></script>
    <script src="admin.js"></script>
    <script src="contact.js"></script>
    <script>
        function closeIntro() {
            document.getElementById('introScreen').classList.add('hidden');
        }

        // Initialize and display the services dynamically
        loadServicesData();
        renderOwnerDetails();
        renderFooter();
    </script>
</body>
</html>
