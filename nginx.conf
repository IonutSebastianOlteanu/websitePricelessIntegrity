server {
    listen 80;
    server_name madamebeauty.com www.madamebeauty.com priceless-integrity.com www.priceless-integrity.com;

    # Root directory where your index.html and assets are located
    root /var/www/madamebeauty;
    index index.html;

    # Hide Nginx version details to minimize information disclosure
    server_tokens off;

    # Disable sendfile to prevent stale file serving in cloud/virtual environments
    sendfile off;
    tcp_nopush off;

    location / {
        try_files $uri $uri/ =404;
    }

    # Security headers
    add_header X-Frame-Options "SAMEORIGIN";
    add_header X-XSS-Protection "1; mode=block";
    add_header X-Content-Type-Options "nosniff";
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    
    # Content Security Policy - Restricts asset loading to self and trusted font/image providers
    add_header Content-Security-Policy "default-src 'self'; font-src 'self' https://cdnjs.cloudflare.com; style-src 'self' 'unsafe-inline' https://cdnjs.cloudflare.com; img-src 'self' data: https://images.unsplash.com; frame-src https://www.google.com;";
    
    # HTTP Strict Transport Security (HSTS) - Enabled for 1 year when transitioned to HTTPS
    # add_header Strict-Transport-Security "max-age=31536000; includeSubDomains" always;

    # Prevent browser caching for JS and CSS files during development
    location ~* \.(?:css|js)$ {
        expires -1;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate, max-age=0";
        try_files $uri =404;
    }

    # Handle logs
    access_log /var/log/nginx/madamebeauty.access.log;
    error_log /var/log/nginx/madamebeauty.error.log;
}